          <div class="grid split" style="margin-top:14px"><div class="card"><div class="bd" style="padding:8px">${[['all', 'ผู้ใช้ทั้งหมด', U.length, 'users'], ['none', 'ยังไม่จัดกลุ่ม', U.filter((u) => !u.group).length, 'list']].map(([k, l, n, i]) => html`<button class="btn ghost" data-fo="${k}" style="width:100%;justify-content:flex-start;${folder === k ? 'background:var(--accent-soft);color:var(--accent-2)' : ''}">${ic(i, 'sm')} <span class="grow" style="text-align:left">${l}</span><span class="muted">${n}</span></button>`)}<div class="muted" style="font-size:11px;font-weight:700;padding:10px 10px 4px;text-transform:uppercase">แผนก / กลุ่ม</div>${G.map((g) => html`<div class="row nw" style="gap:2px"><button class="btn ghost grow" data-fo="${g.id}" style="justify-content:flex-start;${folder === g.id ? 'background:var(--accent-soft);color:var(--accent-2)' : ''}">${ic('folder', 'sm')} <span class="grow trunc" style="text-align:left">${g.name}</span><span class="muted">${U.filter((u) => u.group === g.id).length}</span></button><button class="btn ghost icon sm" data-rn="${g.id}" aria-label="เปลี่ยนชื่อ" ${T.can('manage') ? '' : raw('disabled')}>${ic('edit', 'sm')}</button><button class="btn ghost icon sm" data-dg="${g.id}" aria-label="ลบกลุ่ม" ${T.can('manage') ? '' : raw('disabled')}>${ic('trash', 'sm')}</button></div>`)}<button class="btn ghost" id="ng" style="width:100%;justify-content:flex-start;color:var(--accent-2)" ${T.can('manage') ? '' : raw('disabled')}>${ic('plus', 'sm')} สร้างกลุ่ม</button></div></div>
          <div class="card" id="tbl"></div></div>`);
        const dt = new T.DataTable(T.$('#tbl', el), { id: 'fs', pageSize: 10, searchKeys: ['email', 'name'], exportName: 'fullsnap-users', getRows: () => M.fsUsers().filter((u) => folder === 'all' || (folder === 'none' ? !u.group : u.group === folder)),
          bulk: [{ label: 'ย้ายไปกลุ่ม…', can: 'manage', run: async (rows) => { const r = await T.modal({ title: `ย้าย ${rows.length} คน`, okText: 'ย้าย', body: html`<form>${T.field({ name: 'g', label: 'กลุ่มปลายทาง', type: 'select', options: [{ v: '', l: '— ไม่จัดกลุ่ม —' }, ...M.fsGroups().map((g) => ({ v: g.id, l: g.name }))] })}</form>`, onOk: (m) => T.$('[name=g]', m).value }); if (r === false) return; const gid = r === true ? '' : r; rows.forEach((u) => (u.group = gid || null)); M.save('fsUsers'); M.audit('fullsnap.move', `${rows.length} users`, gname(gid)); T.toast(`ย้าย ${rows.length} คนแล้ว`, 'ok'); draw(); } }],
          columns: [{ key: 'email', label: 'ผู้ใช้', render: (u) => html`<b>${u.name}</b><div class="muted mono" style="font-size:11.5px">${u.email}</div>` }, { key: 'group', label: 'กลุ่ม', render: (u) => gname(u.group), sortVal: (u) => gname(u.group), csv: (u) => gname(u.group) }, { key: 'active', label: 'สิทธิ์', render: (u) => T.switchEl(u.active, `data-ac="${u.id}"`), csv: (u) => u.active }, { key: 'last', label: 'ใช้งานล่าสุด', render: (u) => ago(u.last), csv: (u) => T.fmtFull(u.last) },
            { key: 'devices', label: 'เครื่อง', sortVal: (u) => u.devices.length, render: (u) => { const live2 = u.devices.filter((d) => !d.revoked); const st = live2.filter((d) => M.NOW - d.last > 7 * 86400e3).length; return html`<span class="row nw"><b>${live2.length - st}</b> <span class="muted">ใช้งาน</span>${st ? html`<span class="chip med">ค้าง ${st}</span>` : ''}</span>`; }, csv: (u) => u.devices.length }],
          onRow: (u) => devices(u, dt) });
        T.on(T.$('#tbl', el), 'click', '[data-ac]', (e, b) => { const u = M.fsUsers().find((x) => x.id === b.dataset.ac); u.active = !u.active; if (!u.active) u.devices.forEach((d) => (d.revoked = true)); M.save('fsUsers'); M.audit('fullsnap.access', u.email, String(u.active)); T.toast(u.active ? 'เปิดสิทธิ์แล้ว' : 'ปิดสิทธิ์และเพิกถอนทุกเครื่องแล้ว', 'ok'); draw(); });
      };
      function devices(u, dt) {
        const can = T.can('manage'); const live = u.devices.filter((d) => !d.revoked); const stale = live.filter((d) => M.NOW - d.last > 7 * 86400e3);
        const card = (d) => { const st = d.revoked ? ['gray', 'ถูกเพิกถอน'] : M.NOW - d.last < 86400e3 ? ['ok', 'ใช้งานอยู่'] : M.NOW - d.last < 7 * 86400e3 ? ['info', 'ใช้ในสัปดาห์นี้'] : ['med', `ค้าง ${Math.floor((M.NOW - d.last) / 86400e3)} วัน`]; return html`<div class="card" style="padding:12px;margin-bottom:10px"><div class="row nw"><div class="grow"><b>${d.app}</b> <span class="mono muted">${d.ext}</span><div class="row" style="gap:6px;margin-top:3px"><span class="chip ${d.browser === 'MS Edge' ? 'acc' : 'gray'}">${d.browser}</span><span class="muted">${d.ver} · ${d.os}</span></div></div><span class="chip ${st[0]}">${st[1]}</span>${!d.revoked ? html`<button class="btn sm danger" data-rv="${d.id}" ${can ? '' : raw('disabled')}>${ic('ban', 'sm')} เพิกถอน</button>` : ''}</div><dl class="kv" style="margin-top:8px;font-size:12px"><dt>ใช้งานล่าสุด</dt><dd>${ago(d.last)}</dd><dt>ล็อกอินเมื่อ</dt><dd>${T.fmtFull(d.signed).slice(0, 10)}</dd><dt>IP ตอนล็อกอิน</dt><dd class="mono">${d.ip}</dd></dl></div>`; };
        const dr = T.drawer({ title: u.name, sub: html`<span class="mono">${u.email}</span> · ${gname(u.group)}`, width: 560, body: html`<div class="row" style="margin-bottom:10px"><b>เครื่องที่ล็อกอินอยู่ (${live.length})</b><span class="grow"></span>${stale.length ? html`<button class="btn sm" data-clr ${can ? '' : raw('disabled')}>${ic('ban', 'sm')} ล้างเครื่องค้าง (${stale.length})</button>` : ''}</div>${live.length ? live.map(card) : html`<div class="empty">ไม่มีเครื่องที่ล็อกอินอยู่</div>`}${u.devices.some((d) => d.revoked) ? html`<div class="muted" style="margin:12px 0 6px">เครื่องที่ปิดแล้ว (${u.devices.filter((d) => d.revoked).length})</div>${u.devices.filter((d) => d.revoked).map(card)}` : ''}`,
          onMount(e2, en) { T.on(e2, 'click', '[data-rv]', async (e, b) => { if (!(await T.confirm('เพิกถอนเครื่องนี้? ผู้ใช้ต้องล็อกอินใหม่', 'เพิกถอน'))) return; u.devices.find((d) => d.id === b.dataset.rv).revoked = true; M.save('fsUsers'); M.audit('fullsnap.revoke', u.email, b.dataset.rv); T.toast('เพิกถอนแล้ว', 'ok'); en.close(); draw(); devices(u, dt); });
            T.on(e2, 'click', '[data-clr]', async () => { if (!(await T.confirm(`เพิกถอน ${stale.length} เครื่องที่ไม่ได้ใช้เกิน 7 วัน?`, 'ล้าง'))) return; stale.forEach((d) => (d.revoked = true)); M.save('fsUsers'); M.audit('fullsnap.clear_stale', u.email, String(stale.length)); T.toast('ล้างเครื่องค้างแล้ว', 'ok'); en.close(); draw(); devices(u, dt); }); } });
      }
      draw();
      T.on(el, 'click', '[data-fo]', (e, b) => { folder = b.dataset.fo; draw(); });
      T.on(el, 'click', '#ng', async () => { const ok = await T.modal({ title: 'สร้างกลุ่ม', okText: 'สร้าง', body: html`<form>${T.field({ name: 'n', label: 'ชื่อแผนก / กลุ่ม', required: true })}</form>`, onOk: (m) => { const r = T.readForm(m, { n: [T.V.required] }); if (!r.ok) return false; if (M.fsGroups().some((g) => g.name.toLowerCase() === r.values.n.toLowerCase())) { T.$('[data-f=n] .err', m).textContent = 'มีกลุ่มชื่อนี้แล้ว'; return false; } M.fsGroups().push({ id: 'g' + T.uid(), name: r.values.n }); M.save('fsGroups'); M.audit('fullsnap.group_create', r.values.n); return true; } }); if (ok) draw(); });
      T.on(el, 'click', '[data-rn]', async (e, b) => { const g = M.fsGroups().find((x) => x.id === b.dataset.rn); const ok = await T.modal({ title: 'เปลี่ยนชื่อกลุ่ม', okText: 'บันทึก', body: html`<form>${T.field({ name: 'n', label: 'ชื่อกลุ่ม', value: g.name, required: true })}</form>`, onOk: (m) => { const r = T.readForm(m, { n: [T.V.required] }); if (!r.ok) return false; g.name = r.values.n; M.save('fsGroups'); M.audit('fullsnap.group_rename', g.name); return true; } }); if (ok) draw(); });
      T.on(el, 'click', '[data-dg]', async (e, b) => { const g = M.fsGroups().find((x) => x.id === b.dataset.dg); const n = M.fsUsers().filter((u) => u.group === g.id).length; if (await T.confirm(`ลบกลุ่ม "${g.name}"? สมาชิก ${n} คนจะย้ายไป "ยังไม่จัดกลุ่ม" (ไม่ถูกลบ)`, 'ลบกลุ่ม')) { M.fsUsers().forEach((u) => { if (u.group === g.id) u.group = null; }); const a = M.fsGroups(); a.splice(a.indexOf(g), 1); M.save('fsGroups'); M.save('fsUsers'); M.audit('fullsnap.group_delete', g.name); if (folder === g.id) folder = 'all'; draw(); T.toast('ลบกลุ่มแล้ว', 'ok'); } });

        onOk: (m) => { const r = T.readForm(m, { emails: [T.V.required] }); if (!r.ok) return false; const list = r.values.emails.split(/[\n,;\s]+/).map((x) => x.trim().toLowerCase()).filter(Boolean); const added = [], skipped = []; list.forEach((e) => { if (T.V.email(e)) skipped.push(`${e} (รูปแบบผิด)`); else if (!DOMAINS.includes(e.split('@')[1])) skipped.push(`${e} (โดเมนไม่ได้รับอนุญาต)`); else if (M.fsUsers().some((u) => u.email === e) || added.includes(e)) skipped.push(`${e} (มีอยู่แล้ว)`); else added.push(e); });
          added.forEach((e) => M.fsUsers().unshift({ id: 'fs' + T.uid(), email: e, name: e.split('@')[0].replace(/^./, (c) => c.toUpperCase()), group: r.values.g || null, active: true, last: 0, devices: [] })); if (added.length) { M.save('fsUsers'); M.audit('fullsnap.add', `${added.length} users`); }
          if (skipped.length) { T.$('#addres', m).innerHTML = `<div class="chip high" style="white-space:normal">เพิ่ม ${added.length} คน · ข้าม ${skipped.length}: ${T.esc(skipped.slice(0, 4).join(', '))}</div>`; return added.length ? (setTimeout(draw, 0), false) : false; } return true; } }); if (ok) { T.toast('เพิ่มผู้ใช้แล้ว', 'ok'); draw(); } });
    },
  });
})();

          <div class="grid g2"><div class="card"><div class="hd"><h3>ข้อมูลบัญชี</h3></div><div class="bd"><form id="pf">${T.field({ name: 'name', label: 'ชื่อที่แสดง', value: s.name, required: true })}${T.field({ name: 'email', label: 'อีเมล', value: s.email, readonly: true })}<dl class="kv" style="margin-bottom:12px"><dt>บทบาท</dt><dd><span class="chip crit">Super Admin</span></dd><dt>การยืนยันตัวตนสองขั้นตอน</dt><dd><span class="chip ok">เปิดใช้งาน (TOTP)</span></dd></dl><button class="btn pri">บันทึก</button></form></div></div>
            <div class="card"><div class="hd"><h3>เปลี่ยนรหัสผ่าน</h3></div><div class="bd"><form id="pw" novalidate>${T.field({ name: 'cur', label: 'รหัสผ่านปัจจุบัน', type: 'password', required: true })}${T.field({ name: 'np', label: 'รหัสผ่านใหม่', type: 'password', required: true, help: 'อย่างน้อย 10 ตัวอักษร ผสมตัวพิมพ์ใหญ่เล็ก ตัวเลข และสัญลักษณ์' })}<div class="bar" style="margin:-6px 0 12px"><i id="str" style="width:0"></i></div>${T.field({ name: 'cf', label: 'ยืนยันรหัสผ่านใหม่', type: 'password', required: true })}<button class="btn pri">เปลี่ยนรหัสผ่าน</button></form></div></div></div>
          <div class="card" style="margin-top:14px"><div class="hd"><h3>อุปกรณ์ที่เข้าสู่ระบบอยู่</h3><span class="grow"></span><button class="btn sm danger" id="rall">เพิกถอนทั้งหมดยกเว้นเครื่องนี้</button></div><div class="bd flush"><table class="t cards"><thead><tr><th>อุปกรณ์</th><th>IP</th><th>ใช้งานล่าสุด</th><th></th></tr></thead><tbody>${sessions.map((x) => html`<tr><td data-label="อุปกรณ์"><b>${x.dev}</b> ${x.cur ? html`<span class="chip ok">เครื่องนี้</span>` : ''}</td><td data-label="IP" class="mono">${x.ip}</td><td data-label="ล่าสุด">${T.ago(x.t)}</td><td class="nolabel">${x.cur ? '' : html`<button class="btn sm" data-rs="${x.id}">เพิกถอน</button>`}</td></tr>`)}</tbody></table></div></div>
          <div class="card" style="margin-top:14px"><div class="hd"><h3>การแสดงผล</h3></div><div class="bd"><div class="row nw"><span class="grow">ธีม</span><div class="seg"><button data-th="light" class="${document.documentElement.dataset.theme === 'light' ? 'on' : ''}">สว่าง</button><button data-th="dark" class="${document.documentElement.dataset.theme === 'dark' ? 'on' : ''}">มืด</button></div></div></div></div>`);
        T.$('#pf', el).onsubmit = (e) => { e.preventDefault(); const r = T.readForm(T.$('#pf', el), { name: [T.V.required, T.V.min(2)] }); if (!r.ok) return; const cur = T.session(); cur.name = r.values.name; cur.initials = r.values.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase(); T.store.set('session', cur); M.audit('profile.update', cur.email); T.toast('บันทึกแล้ว', 'ok'); T.rerender(); };
        const np = T.$('[name=np]', el); np.oninput = () => { const v = pwStrength(np.value); const b = T.$('#str', el); b.style.width = v * 25 + '%'; b.style.background = ['var(--crit)', 'var(--crit)', 'var(--med)', 'var(--green)', 'var(--green)'][v]; };
        T.$('#pw', el).onsubmit = (e) => { e.preventDefault(); const f = T.$('#pw', el); const r = T.readForm(f, { cur: [T.V.required], np: [T.V.required, T.V.min(10), (v) => (pwStrength(v) >= 3 ? '' : 'รหัสผ่านยังไม่แข็งแรงพอ ผสมตัวพิมพ์ใหญ่เล็ก ตัวเลข และสัญลักษณ์'), (v, all) => (v !== all.cur ? '' : 'ต้องไม่ซ้ำกับรหัสผ่านเดิม')], cf: [T.V.required, (v, all) => (v === all.np ? '' : 'รหัสผ่านไม่ตรงกัน')] }); if (!r.ok) return; if (r.values.cur !== 'Demo#2026') { T.$('[data-f=cur] .err', f).textContent = 'รหัสผ่านปัจจุบันไม่ถูกต้อง'; f.querySelector('[data-f=cur]').classList.add('bad'); return; } M.audit('profile.password_change', s.email); T.toast('เปลี่ยนรหัสผ่านแล้ว (ตัวอย่าง: รหัสผ่านของบัญชีทดลองไม่เปลี่ยนจริง)', 'ok'); f.reset(); };
      };
      draw();
      T.on(el, 'click', '[data-rs]', async (e, b) => { if (await T.confirm('เพิกถอนอุปกรณ์นี้?', 'เพิกถอน')) { sessions.splice(sessions.findIndex((x) => x.id === b.dataset.rs), 1); M.save('mysessions'); M.audit('session.revoke', b.dataset.rs); draw(); } });
      T.on(el, 'click', '#rall', async () => { if (await T.confirm('เพิกถอนทุกอุปกรณ์ยกเว้นเครื่องนี้?', 'เพิกถอน')) { const keep = sessions.filter((x) => x.cur); sessions.length = 0; sessions.push(...keep); M.save('mysessions'); M.audit('session.revoke_all'); draw(); } });
      T.on(el, 'click', '[data-th]', (e, b) => { T.setTheme(b.dataset.th); });
    },
  });
})();

// ---- js/app.js
/* TENIX One demo — application shell: navigation, top bar, router, auth gate. */
(function () {
  'use strict';
  const { html, raw, icon: ic, esc } = T;

  const NAV = [
    { title: 'Overview', items: [{ name: 'Dashboard', href: '/dashboard', icon: 'home' }, { name: 'Monitoring', icon: 'radar', children: [{ name: 'System Health', href: '/health' }, { name: 'Network Monitor', href: '/network' }, { name: 'Uptime Pulse (TUP)', href: '/uptime' }] }] },
    { title: 'Security', items: [{ name: 'Alerts', href: '/alerts', icon: 'bell' }, { name: 'Email Monitoring', href: '/email', icon: 'mail' }, { name: 'Dump IOC', href: '/ioc', icon: 'list' }, { name: 'SOC Wall', href: '/wall', icon: 'monitor' }, { name: 'Web Defacement', href: '/defacement', icon: 'scan' }, { name: 'Cloudflare', icon: 'cloud', children: [{ name: 'WAF Insights', href: '/waf' }, { name: 'ความปลอดภัยของ Zone', href: '/waf/security' }, { name: 'กฎ & บล็อค IP', href: '/waf/rules' }] }] },
    { title: 'Management', items: [{ name: 'Tenants', href: '/tenants', icon: 'building' }, { name: 'Users', href: '/users', icon: 'user' }, { name: 'Proxy Hub', href: '/proxy', icon: 'net' }, { name: 'Tenix FullSnap', href: '/fullsnap', icon: 'pkg' }, { name: 'Audit log', href: '/audit', icon: 'file' }] },
  ];
  const PUBLIC = ['/', '/login'];
  const session = () => T.store.get('session', null);
  T.session = session;
  let cleanup = null, shellBuilt = false;

  function navHTML(cur) {
    const open = T.store.get('navopen', {});
    return html`${NAV.map((s) => html`<div class="sec">${s.title}</div><div class="nav">${s.items.map((it) => it.children
      ? (() => { const active = it.children.some((c) => c.href === cur); const isOpen = open[it.name] !== undefined ? open[it.name] : active; return html`<button class="grp" data-grp="${it.name}" aria-expanded="${isOpen}">${ic(it.icon)}<span>${it.name}</span><span class="chev">${ic('down', 'sm')}</span></button>${isOpen ? html`<div class="sub-links">${it.children.map((c) => html`<a href="#${c.href}" class="${c.href === cur ? 'on' : ''}">${c.name}</a>`)}</div>` : ''}`; })()
      : html`<a href="#${it.href}" class="${it.href === cur ? 'on' : ''}">${ic(it.icon)}<span>${it.name}</span></a>`)}</div>`)}`;
  }

  function buildShell() {
    const app = T.$('#app'); const s = session();
    T.mount(app, html`<aside class="side" id="side"><div class="brand"><a href="#/dashboard">${raw(T.WM)}</a></div><nav id="nav"></nav><div class="foot">TENIX One · Security Operations</div></aside><div class="scrim" id="scrim"></div>
    <div class="main"><header class="top"><button class="btn icon menu-btn" id="menuBtn" aria-label="เมนู">${ic('menu')}</button><div><h1 id="ptitle"></h1><div class="crumb" id="pcrumb"></div></div><span class="grow"></span>
      <select class="select hide-sm" id="tenantSel" style="width:auto;min-height:34px;padding:5px 10px" aria-label="Tenant"></select>
      <span class="chip ok hide-sm" id="apiPill" title="สถานะการเชื่อมต่อ API"><span class="dot ok pulse"></span><span id="apiTxt">API ปกติ</span></span>
      <div style="position:relative"><button class="btn icon" id="bellBtn" aria-label="การแจ้งเตือน">${ic('bell')}<span id="bellN" class="chip crit" style="position:absolute;top:-6px;right:-6px;padding:0 6px;font-size:10.5px"></span></button></div>
      <button class="btn icon" id="themeBtn" aria-label="สลับธีม"></button>
      <button class="btn" id="userBtn" aria-haspopup="menu"><span class="chip acc" style="padding:1px 8px">${(s && s.initials) || 'DA'}</span><span class="hide-sm">${esc((s && s.name) || 'Demo Admin')}</span>${ic('down', 'sm')}</button></header>
      <main class="page" id="page" tabindex="-1"></main></div>`);
    T.$('#menuBtn').onclick = () => document.body.classList.toggle('nav-open');
    T.$('#scrim').onclick = () => document.body.classList.remove('nav-open');
    T.on(T.$('#nav'), 'click', '[data-grp]', (e, b) => { const o = T.store.get('navopen', {}); o[b.dataset.grp] = b.getAttribute('aria-expanded') !== 'true'; T.store.set('navopen', o); renderNav(); });
    T.on(T.$('#nav'), 'click', 'a', () => document.body.classList.remove('nav-open'));
    T.$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    T.$('#bellBtn').onclick = bellMenu; T.$('#userBtn').onclick = userMenu;
    const sel = T.$('#tenantSel'); T.mount(sel, html`<option value="all">ทุก Tenant</option>${M.tenants().map((t) => html`<option value="${t.id}" ${T.state.tenant === t.id ? raw('selected') : ''}>${t.name}</option>`)}`);
    sel.onchange = () => { T.state.tenant = sel.value; T.store.set('tenant', sel.value); route(); };
    T.net.sub((e) => { const p = T.$('#apiTxt'); if (p) p.textContent = `API ปกติ · ${e.ms} ms`; });
    shellBuilt = true; setTheme(T.store.get('theme', 'light'), true); updateBell();
  }
  function renderNav() { const n = T.$('#nav'); if (n) T.mount(n, navHTML(T.cur())); }
  function setTheme(t, silent) { document.documentElement.dataset.theme = t; T.store.set('theme', t); const b = T.$('#themeBtn'); if (b) T.mount(b, ic(t === 'dark' ? 'sun' : 'moon')); if (!silent) route(); }
  T.setTheme = setTheme;
  function updateBell() { const n = M.alerts().filter((a) => a.status === 'new' && (a.sev === 'critical' || a.sev === 'high')).length; const el = T.$('#bellN'); if (el) { el.textContent = n > 99 ? '99+' : n; el.style.display = n ? '' : 'none'; } }

  function pop(anchor, content, wire) {
    T.$$('.popmenu').forEach((p) => p.remove());
    const p = document.createElement('div'); p.className = 'popmenu card'; p.style.cssText = 'position:fixed;z-index:90;min-width:260px;max-width:92vw;padding:6px;max-height:70vh;overflow:auto';
    p.innerHTML = T.str(content); document.body.appendChild(p);
    const r = anchor.getBoundingClientRect(); p.style.top = r.bottom + 6 + 'px'; p.style.right = Math.max(8, innerWidth - r.right) + 'px';
    const close = (e) => { if (!p.contains(e.target) && !anchor.contains(e.target)) { p.remove(); document.removeEventListener('mousedown', close); } }; setTimeout(() => document.addEventListener('mousedown', close), 0);
    wire && wire(p, () => { p.remove(); document.removeEventListener('mousedown', close); });
  }
  function bellMenu(e) {
    const rows = M.alerts().filter((a) => a.status === 'new').sort((a, b) => b.time - a.time).slice(0, 6);
    pop(e.currentTarget, html`<div style="padding:8px 10px;font-weight:700">แจ้งเตือนล่าสุด</div>${rows.map((a) => html`<a href="#/alerts?open=${a.id}" data-close style="display:block;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none"><div class="row nw">${T.sevChip(a.sev)}<span class="trunc">${a.title}</span></div><div class="muted" style="font-size:12px">${a.host} · ${T.ago(a.time)}</div></a>`)}<a href="#/alerts" data-close style="display:block;padding:8px 10px;text-align:center;font-weight:600">ดูทั้งหมด</a>`, (p, close) => T.on(p, 'click', '[data-close]', close));
  }
  function userMenu(e) {
    const s = session(); const roles = ['Super Admin', 'Staff', 'Intern'];
    pop(e.currentTarget, html`<div style="padding:10px"><b>${s.name}</b><div class="muted" style="font-size:12px">${s.email}</div></div>
      <div style="padding:6px 10px"><label class="muted" style="font-size:11.5px;font-weight:600">ดูระบบในฐานะ (ตัวอย่างสิทธิ์ RBAC)</label><div class="seg" style="margin-top:4px;display:flex">${roles.map((r) => html`<button data-role="${r}" class="${T.state.role === r ? 'on' : ''}" style="flex:1">${r}</button>`)}</div></div>
      <button class="btn ghost" data-act="profile" style="width:100%;justify-content:flex-start">${ic('user')} โปรไฟล์และความปลอดภัย</button>
      <button class="btn ghost" data-act="reset" style="width:100%;justify-content:flex-start">${ic('refresh')} คืนค่าข้อมูลตัวอย่าง</button>
      <button class="btn ghost" data-act="out" style="width:100%;justify-content:flex-start">${ic('out')} ออกจากระบบ</button>`, (p, close) => {
      T.on(p, 'click', '[data-role]', (ev, b) => { T.state.role = b.dataset.role; T.store.set('role', b.dataset.role); close(); T.toast(`ดูในฐานะ ${b.dataset.role}`, 'ok'); route(); });
      T.on(p, 'click', '[data-act]', async (ev, b) => { close(); if (b.dataset.act === 'profile') T.go('/profile'); if (b.dataset.act === 'out') { M.audit('auth.logout', session().email); T.store.set('session', null); shellBuilt = false; T.go('/'); } if (b.dataset.act === 'reset' && (await T.confirm('คืนค่าข้อมูลตัวอย่างทั้งหมดเป็นค่าเริ่มต้น? การเปลี่ยนแปลงที่ทำไว้จะหายไป', 'คืนค่า'))) { const keep = session(); M.reset(); T.store.set('session', keep); location.reload(); } });
    });
  }

  function route() {
    if (cleanup) { try { cleanup(); } catch { /* ignore */ } cleanup = null; }
    T.tipHide(); T.closeAll();
    const path = T.cur(); const s = session();
    document.body.classList.remove('nav-open'); document.body.classList.toggle('wall', path === '/wall');
    if (!PUBLIC.includes(path) && !s) { T.go('/login'); return; }
    if (path === '/login' && s) { T.go('/dashboard'); return; }
    const page = T.pages[path] || (PUBLIC.includes(path) ? null : T.pages['/404']);
    if (PUBLIC.includes(path) || path === '/wall') { shellBuilt = false; const app = T.$('#app'); app.className = ''; }
    if (PUBLIC.includes(path)) { document.title = (page.title || 'TENIX One') + ' · TENIX One'; const out = page.render(T.$('#app')); cleanup = typeof out === 'function' ? out : null; window.scrollTo(0, 0); return; }
    if (path === '/wall') { document.title = 'SOC Wall · TENIX One'; const out = page.render(T.$('#app')); cleanup = typeof out === 'function' ? out : null; return; }
    if (!shellBuilt || !T.$('#page')) buildShell();
    renderNav();
    // A fresh container for every page: listeners a previous page attached to it must not survive navigation.
    const prev = T.$('#page'); const node = prev.cloneNode(false); prev.replaceWith(node);
    T.$('#ptitle').textContent = page.title; T.$('#pcrumb').textContent = page.group || '';
    document.title = page.title + ' · TENIX One'; updateBell();
    node.scrollTop = 0; window.scrollTo(0, 0);
    const out = page.render(node, { query: new URLSearchParams((location.hash.split('?')[1]) || '') }); cleanup = typeof out === 'function' ? out : null;
    T.rerender = route;
  }
  T.rerender = route;
  T.refreshChrome = () => { updateBell(); };
  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', () => { document.documentElement.dataset.theme = T.store.get('theme', 'light'); if (!location.hash) location.hash = '#/'; route(); });

  T.route('/404', { title: 'ไม่พบหน้า', render(el) { T.mount(el, html`<div class="empty" style="padding:80px 16px">${ic('search')}<h2>ไม่พบหน้าที่ต้องการ</h2><p>ลิงก์อาจไม่ถูกต้อง หรือหน้านี้ถูกย้ายแล้ว</p><a class="btn pri" href="#/dashboard">กลับสู่ Dashboard</a></div>`); } });
})();

</script>
</body>
