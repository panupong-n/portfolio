<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TENIX One</title>
<meta name="description" content="TENIX One — Security Operations Platform (interactive demo, sample data)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1a33'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='%237cc4ff' font-family='Arial'%3ET%3C/text%3E%3C/svg%3E">
<style>
/* TENIX One — design system. Tokens first; components below share them. */
:root{
  --bg:#f3f6fb; --surface:#fff; --surface-2:#f6f8fc; --surface-3:#eaf0f8; --border:#e1e8f1; --border-2:#cfd9e6;
  --text:#0e1726; --text-2:#4b5b73; --text-3:#7a8ba3;
  --accent:#0ea5e9; --accent-2:#0284c7; --accent-soft:#e0f2fd;
  --crit:#dc2626; --high:#ea580c; --med:#ca8a04; --low:#16a34a; --info:#0284c7;
  --crit-soft:#fde8e8; --high-soft:#fdebdd; --med-soft:#fbf0cd; --low-soft:#dcfce7; --info-soft:#e0f2fe;
  --green:#16a34a; --green-soft:#dcfce7; --purple:#7856ff; --gray:#8392a8; --gray-soft:#eef1f5;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 4px 14px rgba(14,23,38,.05);
  --radius:14px; --side:244px; --top:58px;
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun","Garuda",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#0a1120; --surface:#111b2e; --surface-2:#0e1728; --surface-3:#182640; --border:#22314a; --border-2:#2f4262;
  --text:#eef3fa; --text-2:#b3c0d3; --text-3:#7f90aa;
  --accent:#38bdf8; --accent-2:#0ea5e9; --accent-soft:rgba(56,189,248,.14);
  --crit:#f87171; --high:#fb923c; --med:#facc15; --low:#4ade80; --info:#38bdf8;
  --crit-soft:rgba(248,113,113,.16); --high-soft:rgba(251,146,60,.16); --med-soft:rgba(250,204,21,.16); --low-soft:rgba(74,222,128,.16); --info-soft:rgba(56,189,248,.16);
  --green:#34d399; --green-soft:rgba(52,211,153,.16); --gray:#8ea0ba; --gray-soft:rgba(142,160,186,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent-2);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text-3)} .sub{color:var(--text-2)}
.nowrap{white-space:nowrap} .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right} .center{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
svg.i.lg{width:20px;height:20px} svg.i.sm{width:14px;height:14px}

/* ── shell ── */
#app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.side .brand{height:var(--top);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border)}
.side .brand img{height:34px;width:auto}
.side nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.side .sec{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);padding:14px 10px 6px}
.nav a,.nav button.grp{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;color:var(--text-2);font-size:13.5px;background:none;border:0;cursor:pointer;text-align:left;text-decoration:none}
.nav a:hover,.nav button.grp:hover{background:var(--surface-2);text-decoration:none;color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav .sub-links{margin:2px 0 4px 20px;border-left:1px solid var(--border);padding-left:6px}
.nav .sub-links a{font-size:13px;padding:6px 10px}
.nav .chev{margin-left:auto;transition:transform .15s} .nav .grp[aria-expanded=true] .chev{transform:rotate(180deg)}
.side .foot{border-top:1px solid var(--border);padding:12px 14px;font-size:12px;color:var(--text-3)}
.main{margin-left:var(--side);flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:var(--top);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px}
.top h1{font-size:16px;font-weight:700} .top .crumb{font-size:12px;color:var(--text-3)}
.top .grow{flex:1}
.page{padding:20px;max-width:1500px;width:100%;margin:0 auto}
.menu-btn{display:none}
.scrim{display:none}
@media(max-width:960px){
  .side{transform:translateX(-100%)} body.nav-open .side{transform:none;box-shadow:var(--shadow)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .main{margin-left:0} .menu-btn{display:inline-flex} .page{padding:14px} .top{padding:0 12px}
  .top .hide-sm{display:none}
}

/* ── primitives ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card>.hd h3{font-size:14px;font-weight:700} .card>.bd{padding:16px} .card>.bd.flush{padding:0}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main{grid-template-columns:1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stack>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.nw{flex-wrap:nowrap} .grow{flex:1}
.pghead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pghead h2{font-size:20px;font-weight:700} .pghead p{margin:2px 0 0;color:var(--text-3);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;min-height:34px}
.btn:hover{background:var(--surface-2);color:var(--text)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff} .btn.pri:hover{filter:brightness(.95);background:var(--accent)}
.btn.danger{color:var(--crit)} .btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:4px 9px;min-height:28px;font-size:12px} .btn.ghost{border-color:transparent;background:transparent}
.btn.icon{padding:7px;min-width:34px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.high{background:var(--high-soft);color:var(--high)} .chip.med{background:var(--med-soft);color:var(--med)}
.chip.low,.chip.ok{background:var(--low-soft);color:var(--low)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.gray{background:var(--gray-soft);color:var(--gray)}
.chip.acc{background:var(--accent-soft);color:var(--accent-2)} .chip.purple{background:rgba(120,86,255,.14);color:var(--purple)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray)} .dot.ok{background:var(--green)} .dot.warn{background:var(--med)} .dot.bad{background:var(--crit)}
.dot.pulse{animation:pulse 1.6s infinite} @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.kpi{padding:14px 16px} .kpi .l{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:12px;font-weight:600}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;line-height:1;font-variant-numeric:tabular-nums} .kpi .s{margin-top:6px;font-size:12px;color:var(--text-3)}
.kpi .d.up{color:var(--crit)} .kpi .d.dn{color:var(--green)}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--border-2);border-radius:9px;padding:8px 11px;min-height:36px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{min-height:90px;resize:vertical;font-family:var(--mono);font-size:12.5px}
.field{margin-bottom:13px} .field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field .help{font-size:11.5px;color:var(--text-3);margin-top:4px} .field .err{font-size:12px;color:var(--crit);margin-top:4px;min-height:0}
.field.bad .input,.field.bad .select,.field.bad .textarea{border-color:var(--crit)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch{position:relative;width:34px;height:20px;border-radius:999px;background:var(--border-2);border:0;cursor:pointer;flex:none;transition:background .15s;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--green)} .switch.on::after{left:16px} .switch:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--text-3);font-weight:600;cursor:pointer;white-space:nowrap;font-size:13px}
.tabs button.on{color:var(--accent-2);border-bottom-color:var(--accent)} .tabs button:hover{color:var(--text)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:7px;color:var(--text-2);font-weight:600;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.empty{padding:34px 16px;text-align:center;color:var(--text-3)} .empty svg.i{width:26px;height:26px;opacity:.6;display:block;margin:0 auto 8px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:13px} .kv dt{color:var(--text-3)} .kv dd{margin:0;word-break:break-word}
@media(max-width:520px){.kv{grid-template-columns:1fr} .kv dt{margin-top:6px}}
.code{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-all}
.code .k{color:var(--accent-2)} .code .s{color:var(--green)} .code .n{color:var(--high)} .code .b{color:var(--purple)}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden} .bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.crit>i{background:var(--crit)} .bar.warn>i{background:var(--med)} .bar.ok>i{background:var(--green)}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}

/* ── table ── */
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.tbar .input,.tbar .select{width:auto;min-width:130px;min-height:34px;padding:6px 10px}
.tbar .search{position:relative;flex:1;min-width:180px;max-width:340px} .tbar .search .input{width:100%;padding-left:32px} .tbar .search svg{position:absolute;left:10px;top:10px;color:var(--text-3)}
.twrap{overflow-x:auto} table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;text-align:left;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
.t th.sortable{cursor:pointer;user-select:none} .t th.sortable:hover{color:var(--text)}
.t td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle} .t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer} .t tbody tr.click:hover td{background:var(--surface-2)} .t tr.sel td{background:var(--accent-soft)}
.pager{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
.bulk{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
@media(max-width:700px){
  table.t.cards thead{display:none} table.t.cards,table.t.cards tbody,table.t.cards tr,table.t.cards td{display:block;width:100%}
  table.t.cards tr{padding:10px 12px;border-bottom:1px solid var(--border)} table.t.cards td{border:0;padding:3px 0;display:flex;gap:10px;justify-content:space-between;text-align:right}
  table.t.cards td::before{content:attr(data-label);color:var(--text-3);font-size:11.5px;font-weight:600;text-align:left;flex:none}
  table.t.cards td.nolabel::before{display:none}
}

/* ── overlays ── */
.ov{position:fixed;inset:0;background:rgba(8,14,26,.5);z-index:80;display:flex}
.drawer{margin-left:auto;width:min(620px,100%);height:100%;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;animation:slide .2s ease-out;box-shadow:var(--shadow)}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)} .drawer .dh h3{font-size:16px} .drawer .db{flex:1;overflow-y:auto;padding:16px 18px} .drawer .df{border-top:1px solid var(--border);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.modal{margin:auto;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .15s ease-out}
.modal.lg{width:min(860px,calc(100% - 24px))} @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)} .modal .mh h3{font-size:15px;flex:1} .modal .mb{padding:18px;overflow-y:auto} .modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;bottom:16px;right:16px;z-index:120;display:flex;flex-direction:column-reverse;gap:8px;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);min-width:240px;font-size:13px;animation:pop .15s}
.toast.ok{border-left-color:var(--green)} .toast.bad{border-left-color:var(--crit)} .toast.warn{border-left-color:var(--med)}
.tip{position:fixed;z-index:130;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;box-shadow:var(--shadow);max-width:260px}

/* ── charts ── */
.chart{width:100%;height:auto;display:block} .chart text{fill:var(--text-3);font-size:10.5px;font-family:var(--font)}
.chart .grid{stroke:var(--border);stroke-width:1} .chart .axis{stroke:var(--border-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin-top:8px} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap} .donutw svg{width:150px;height:150px;flex:none}

/* ── login / landing ── */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.auth .hero{position:relative;padding:44px;display:flex;flex-direction:column;justify-content:space-between;color:#e6edf7;background:radial-gradient(1200px 700px at 20% 10%,#16345c 0,#0a1426 60%),#0a1426;overflow:hidden}
.auth .hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(120,180,255,.18) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(160deg,transparent 30%,#000 100%);pointer-events:none}
.auth .hero>*{position:relative;z-index:1} .auth .hero .tag{letter-spacing:.2em;font-size:12px;color:#7cc4ff}
.auth .hero img{height:84px;width:auto;margin-bottom:18px} .auth .hero p{max-width:460px;color:#b6c6dc;font-size:16px;line-height:1.7}
.auth .form{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--surface)}
.auth .form .box{width:min(400px,100%)} .auth h2{font-size:26px;margin-bottom:6px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth .hero{display:none}}
.totp{display:flex;gap:8px;justify-content:space-between} .totp input{width:100%;text-align:center;font-size:22px;font-family:var(--mono);padding:10px 0;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);outline:none} .totp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.authapp{border:1px dashed var(--border-2);border-radius:12px;padding:12px 14px;background:var(--surface-2);margin-top:16px}
.authapp .code6{font-family:var(--mono);font-size:26px;letter-spacing:.18em;font-weight:700;color:var(--accent-2)}
.land{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.land .nav2{display:flex;align-items:center;gap:14px;padding:16px 0}
.land h1{font-size:38px;line-height:1.15;margin:30px 0 14px} .land .lead{font-size:17px;color:var(--text-2);max-width:760px}
.land section{margin-top:46px} .land h2{font-size:22px;margin-bottom:14px}
.feat{padding:16px} .feat h4{font-size:14.5px;margin:8px 0 4px} .feat p{margin:0;font-size:13px;color:var(--text-2)}
.archbox{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch} .archbox .node{flex:1;min-width:150px;padding:12px 14px;border:1px solid var(--border-2);border-radius:12px;background:var(--surface)} .archbox .node b{display:block;font-size:13px;margin-bottom:3px} .archbox .node span{font-size:12px;color:var(--text-3)}
.archbox .arrow{align-self:center;color:var(--text-3)}

/* ── SOC wall ── */
body.wall{--bg:#060b16;--surface:#0d1626;--surface-2:#0a1220;--surface-3:#16233a;--border:#1b2a44;--border-2:#2a3d5e;--text:#e6edf7;--text-2:#b3c0d3;--text-3:#7f90aa;--accent:#38bdf8;--accent-soft:rgba(56,189,248,.14);--crit:#f87171;--high:#fb923c;--med:#facc15;--low:#4ade80;--info:#38bdf8;--crit-soft:rgba(248,113,113,.16);--high-soft:rgba(251,146,60,.16);--med-soft:rgba(250,204,21,.16);--low-soft:rgba(74,222,128,.16);--info-soft:rgba(56,189,248,.16);--green:#34d399;--green-soft:rgba(52,211,153,.16);background:var(--bg);color:var(--text)}
body.wall .t th{background:#0d1626;border-color:#1b2a44;color:#7f90aa} body.wall .t td{border-color:#16233a}
.wallbig .v{font-size:44px;font-weight:700;line-height:1} .newrow{animation:flash 1.8s ease-out}
@keyframes flash{from{background:rgba(14,165,233,.35)}to{background:transparent}}
.mock-shot{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}

@media print{
  .side,.top,.no-print,#toasts{display:none!important} .main{margin:0} .page{padding:0;max-width:none} body{background:#fff;color:#000}
  .card{box-shadow:none} .report{display:block!important}
}
.report{display:none}
.a4{width:794px;max-width:100%;min-height:1123px;margin:0 auto;background:#fff;color:#111;padding:44px 48px;box-shadow:var(--shadow);position:relative;font-size:12.5px}
.a4 h1{font-size:22px;margin:0 0 4px} .a4 h2{font-size:15px;margin:22px 0 8px;border-bottom:2px solid #0ea5e9;padding-bottom:4px} .a4 .logo{position:absolute;top:34px;right:44px;height:40px}
.a4 table{width:100%;border-collapse:collapse;font-size:12px} .a4 th,.a4 td{border-bottom:1px solid #dde3ec;padding:6px 8px;text-align:left} .a4 th{background:#f1f5fa}
.a4 .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .a4 .kp div{border:1px solid #dde3ec;border-radius:8px;padding:8px 10px} .a4 .kp b{display:block;font-size:20px}
@media print{.a4{box-shadow:none;width:auto;padding:0}}
/* print helper: only #printArea is printed while body.printing */
@media print{body.printing #app,body.printing .ov,body.printing #toasts{display:none!important} body.printing #printArea{display:block!important}}
#printArea{display:none}
.strip{display:flex;gap:2px}.strip i{width:5px;height:16px;border-radius:2px;background:var(--green)} .strip i.yellow{background:var(--med)} .strip i.red{background:var(--crit)} .strip i.gray{background:var(--gray)} .strip i.up{background:var(--green)} .strip i.down{background:var(--crit)}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden} .diff div{padding:3px 10px;white-space:pre-wrap;word-break:break-all} .diff .p{background:var(--low-soft)} .diff .m{background:var(--crit-soft)}
.shotbox{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:10px;min-height:150px} .shotbox .bn{height:10px;border-radius:4px;background:var(--border-2);margin:6px 0} .shotbox .hk{background:var(--crit);color:#fff;font-weight:700;padding:10px;border-radius:6px;text-align:center;margin:6px 0}
.topo text{font-size:11px;fill:var(--text-2)} .topo .node rect,.topo .node circle{fill:var(--surface);stroke:var(--border-2);stroke-width:1.4} .topo .link{stroke:var(--border-2);stroke-width:1.4} .topo .node.sel rect,.topo .node.sel circle{stroke:var(--accent);stroke-width:2.4} .topo .node{cursor:pointer}
.term{background:#0b1220;color:#d6e2f3;border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;height:260px;overflow-y:auto;white-space:pre-wrap} .term .pr{color:#7cc4ff} .term input{background:transparent;border:0;outline:0;color:inherit;font:inherit;width:70%}
.donutw svg text{fill:var(--text-3);font-size:10.5px;font-family:var(--font)}
.split{grid-template-columns:240px minmax(0,1fr);align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}

/* text wordmark (no image logo) */
.wm{font-weight:800;font-size:20px;letter-spacing:.05em;color:var(--text);white-space:nowrap} .wm i{font-style:normal;font-weight:600;color:var(--accent-2)}
.side .brand .wm{font-size:18px} .a4 .logo .wm{color:#0b1a33;font-size:17px}
.auth .hero .wm{color:#fff} .auth .hero .wm.big{font-size:26px}
.auth .hero h3{font-size:30px;line-height:1.3;margin:10px 0 22px;color:#fff;font-weight:700}
.auth .hero .pts{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:440px}
.auth .hero .pts li{display:flex;gap:12px;align-items:center;color:#c3d1e4;font-size:15px}
.auth .hero .pts li svg{flex:none;width:34px;height:34px;padding:8px;border-radius:10px;background:rgba(124,196,255,.12);color:#7cc4ff;box-sizing:border-box}
.auth .hero .fine{font-size:12px;color:#7f93b0}
.auth .form .back{display:inline-block;margin-bottom:22px;font-size:12.5px;color:var(--text-3)} .auth .form .back:hover{color:var(--accent-2)}
.auth .form .mwm{display:none;margin-bottom:18px}
.auth .form .box{padding:6px 0}
@media(max-width:860px){.auth .form{align-items:flex-start;padding:28px 20px}.auth .form .mwm{display:block}}
/* landing */
.land{max-width:none;margin:0;padding:0 0 60px}
.land .nav2{position:sticky;top:0;z-index:20;padding:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.land .nav2 .inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.land .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.land .lhero{padding:64px 0 8px} .land .lhero .tag{letter-spacing:.2em;font-size:12px;color:var(--accent-2);font-weight:600}
.land .lhero h1{font-size:44px;line-height:1.2;margin:12px 0 16px} .land .lhero h1 span{color:var(--accent-2)}
.land .btn.lg{min-height:44px;padding:0 20px;font-size:15px}
.land .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:40px}
.land .stats>div{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface)}
.land .stats b{display:block;font-size:24px;color:var(--text)} .land .stats span{font-size:12.5px;color:var(--text-3)}
@media(max-width:700px){.land .lhero{padding-top:36px}.land .lhero h1{font-size:30px}.land .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.land .nav2 .btn:not(.pri){display:none}}
.auth,.land{flex:1 1 auto;width:100%;min-width:0}
.land .nav2{display:block}.land .nav2 .inner{width:100%;box-sizing:border-box}.land .nav2 .wm{font-size:19px}

    copy: 'M9 9h13v13H9z M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1', term: 'M4 17l6-6-6-6 M12 19h8',

    scan: 'M3 7V5a2 2 0 0 1 2-2h2 M17 3h2a2 2 0 0 1 2 2v2 M21 17v2a2 2 0 0 1-2 2h-2 M7 21H5a2 2 0 0 1-2-2v-2 M7 12h10',
    ext: 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14L21 3', ban: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M4.93 4.93l14.14 14.14',
    folder: 'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z', info: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 16v-4 M12 8h.01',

    expand: 'M15 3h6v6 M9 21H3v-6 M21 3l-7 7 M3 21l7-7',
  };
  T.icon = (n, cls) => T.raw(`<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${(IC[n] || IC.info).split(' M').map((d, i) => `<path d="${i ? 'M' : ''}${d}"/>`).join('')}</svg>`);
  const ic = T.icon;

  /* ── formatting + utilities ── */
  T.rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const pad = (n) => String(n).padStart(2, '0');
  T.fmtDT = (t) => { const d = new Date(t); return `${d.getDate()} ${['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'][d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  T.fmtFull = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  T.ago = (t) => { const s = Math.max(0, (Date.now() - t) / 1000); if (s < 60) return 'เมื่อสักครู่'; if (s < 3600) return `${Math.floor(s / 60)} นาทีที่แล้ว`; if (s < 86400) return `${Math.floor(s / 3600)} ชม.ที่แล้ว`; return `${Math.floor(s / 86400)} วันที่แล้ว`; };
  T.num = (n) => Number(n).toLocaleString('en-US');
  T.bytes = (n) => (n > 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n > 1e3 ? (n / 1e3).toFixed(0) + ' KB' : n + ' B');
  T.pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  T.copy = async (text) => { try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch { /* ignore */ } t.remove(); } T.toast('คัดลอกแล้ว', 'ok'); };
  T.download = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  T.csv = (cols, rows) => { const q = (v) => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }; return '﻿' + [cols.map((c) => q(c.label)).join(','), ...rows.map((r) => cols.map((c) => q(c.csv ? c.csv(r) : r[c.key])).join(','))].join('\n'); };
  T.sevName = (n) => (n >= 90 ? 'critical' : n >= 70 ? 'high' : n >= 40 ? 'medium' : n >= 20 ? 'low' : 'informational');
  T.sevChip = (name) => T.html`<span class="chip ${{ critical: 'crit', high: 'high', medium: 'med', low: 'low', informational: 'info' }[name] || ''}">${name}</span>`;

  T.SEVC = { critical: 'var(--crit)', high: 'var(--high)', medium: 'var(--med)', low: 'var(--low)', informational: 'var(--info)' };
  T.jsonHL = (obj) => T.raw(T.esc(JSON.stringify(obj, null, 2)).replace(/(&quot;(?:\\.|[^&])*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+\.?\d*)/g, (m, s, colon, b, n) => (s ? (colon ? `<span class="k">${s}</span>${colon}` : `<span class="s">${s}</span>`) : b ? `<span class="b">${b}</span>` : `<span class="n">${n}</span>`)));

  T.store = {
    get(k, d) { try { const v = localStorage.getItem('tenixdemo:' + k); return v == null ? d : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem('tenixdemo:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
    clear() { try { Object.keys(localStorage).filter((k) => k.startsWith('tenixdemo:')).forEach((k) => localStorage.removeItem(k)); } catch { /* ignore */ } Object.keys(mem).forEach((k) => delete mem[k]); },
  };
  T.state.role = T.store.get('role', 'Super Admin');
  T.state.tenant = T.store.get('tenant', 'all');
  const ROLE_CAPS = { 'Super Admin': { manage: 1, respond: 1, admin: 1 }, Staff: { manage: 1, respond: 1, admin: 0 }, Intern: { manage: 0, respond: 0, admin: 0 } };
  T.can = (cap) => !!(ROLE_CAPS[T.state.role] || {})[cap];

  /* ── mock service transport: every call goes through here (latency, status, request log) ── */
  T.net = (function () {
    const log = []; const subs = new Set();
    const api = {
      log, last: null,
      sub(fn) { subs.add(fn); return () => subs.delete(fn); },
      async call(label, fn, ms) {
        const t0 = performance.now();
        await new Promise((r) => setTimeout(r, ms == null ? 60 + Math.random() * 180 : ms));
        const out = await fn();
        const e = { label, ms: Math.round(performance.now() - t0), at: Date.now() };
        log.unshift(e); log.length = Math.min(log.length, 40); api.last = e; subs.forEach((f) => f(e));
        return out;
      },
    };
    return api;
  })();

  /* ── toast / tooltip ── */
  T.toast = (msg, type) => {
    let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('role', 'status'); document.body.appendChild(box); }
    const el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg; box.appendChild(el);

  };
  let tipEl = null;
  T.tip = (html, x, y) => { if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); } tipEl.innerHTML = html; tipEl.style.display = 'block'; const w = tipEl.offsetWidth; tipEl.style.left = Math.min(x + 12, innerWidth - w - 8) + 'px'; tipEl.style.top = y + 14 + 'px'; };
  T.tipHide = () => { if (tipEl) tipEl.style.display = 'none'; };

  const stack = [];

    stack.push(entry); document.body.style.overflow = 'hidden'; return entry;

  T.closeAll = () => { while (stack.length) stack[stack.length - 1].close(); };

    if (width) d.style.width = `min(${width}px,100%)`;

          { const c = T.totp(DEMO.secret); inputs.forEach((x, k) => (x.value = c[k])); lastAuto = c; } // pre-filled; the visitor just confirms

            if (lastStep && stepNow <= lastStep) { err.textContent = 'รหัสนี้ถูกใช้ไปแล้ว รอรหัสใหม่ในอีกไม่กี่วินาที'; return; } // a code can be used once
            lastStep = stepNow; T.store.set('lastStep', stepNow);

          };

/* Alerts: triage table, bulk actions, detail drawer (details / timeline / raw log / notes). */
(function () {
  'use strict';
  const { html, raw, icon: ic } = T;
  const ST = { new: ['info', 'ใหม่'], in_progress: ['med', 'กำลังตรวจสอบ'], closed: ['gray', 'ปิดแล้ว'], reopened: ['high', 'เปิดใหม่'] };
  const stChip = (s) => html`<span class="chip ${ST[s][0]}">${ST[s][1]}</span>`;
  T.stChip = stChip;

  function openAlert(id, after) {
    const a = M.alerts().find((x) => x.id === id) || M.alertsBase().find((x) => x.id === id); if (!a) { T.toast('ไม่พบ alert นี้', 'bad'); return; }
    const can = T.can('respond');
    const act = (label, icon, status, extra) => html`<button class="btn ${extra || ''}" data-do="${status}" ${can ? '' : raw('disabled title="ไม่มีสิทธิ์ดำเนินการ"')}>${ic(icon, 'sm')} ${label}</button>`;
    const tl = [{ t: a.time, text: `ตรวจพบโดย ${a.source}`, by: 'system' }, ...M.auditCol().filter((e) => e.target === a.id).map((e) => ({ t: e.t, text: e.action === 'alert.comment' ? `ความคิดเห็น: ${e.detail}` : `อัปเดต: ${e.detail}`, by: e.actor.split('@')[0] }))].sort((x, y) => y.t - x.t);
    const tenant = M.tenantName(a.tenantId);
    const details = html`<div class="row" style="margin-bottom:12px">${T.sevChip(a.sev)} ${stChip(a.status)} <span class="chip acc">${a.source}</span> <span class="chip gray">${tenant}</span></div>
      <p style="margin:0 0 14px">${a.description}</p>
      <dl class="kv"><dt>รหัส</dt><dd class="mono">${a.id}</dd><dt>คะแนนความรุนแรง</dt><dd>${a.severity} / 100</dd><dt>เวลาที่พบ</dt><dd>${T.fmtFull(a.time)} (${T.ago(a.time)})</dd><dt>Tactic</dt><dd>${a.tactic} <span class="muted">(${a.tacticId})</span></dd><dt>Technique</dt><dd>${a.technique} <span class="chip purple">${a.techId}</span></dd>
      <dt>เครื่อง</dt><dd>${a.host} <span class="muted mono">${a.ip}</span></dd><dt>ผู้ใช้</dt><dd>${a.user}</dd><dt>ผู้รับผิดชอบ</dt><dd>${a.assignee || '—'}</dd>
      ${a.source === 'Endpoint (EDR)' ? html`<dt>ไฟล์</dt><dd>${a.filename}</dd><dt>คำสั่ง</dt><dd><div class="code" style="max-height:130px">${a.cmdline}</div></dd><dt>SHA-256</dt><dd class="mono" style="word-break:break-all">${a.sha256}</dd>` : html`<dt>ปลายทาง</dt><dd class="mono">${a.dst}:${a.port}</dd>`}</dl>`;
    const timeline = html`<div class="stack">${tl.map((e) => html`<div class="row nw" style="align-items:flex-start"><span class="dot" style="margin-top:7px"></span><div><div>${e.text}</div><div class="muted" style="font-size:12px">${T.fmtFull(e.t)} · ${e.by}</div></div></div>`)}</div>`;
    const comments = a.comments || [];
    const notes = html`<div class="stack">${comments.length ? comments.slice().reverse().map((c) => html`<div class="card" style="padding:10px 12px"><div style="white-space:pre-wrap">${c.text}</div><div class="muted" style="font-size:12px;margin-top:4px">${c.by} · ${T.fmtFull(c.t)}</div></div>`) : html`<div class="muted">ยังไม่มีความคิดเห็น</div>`}
      <form id="cform"><div class="field"><label for="ctext">เพิ่มความคิดเห็น</label><textarea class="textarea" id="ctext" name="text" rows="3" style="font-family:var(--font)" ${can ? '' : raw('disabled')}></textarea><div class="err"></div></div><button class="btn pri sm" ${can ? '' : raw('disabled')}>บันทึก</button></form></div>`;
    const rawTab = html`<div class="row" style="margin-bottom:8px"><button class="btn sm" data-cp>${ic('copy', 'sm')} คัดลอก</button><button class="btn sm" data-dl>${ic('download', 'sm')} ดาวน์โหลด .json</button></div><div class="code">${T.jsonHL(a.raw)}</div>`;
    const d = T.drawer({ title: a.title, sub: html`<span class="mono">${a.id}</span> · ${a.host}`, width: 640,
      tabs: [{ id: 'd', label: 'รายละเอียด', html: details }, { id: 't', label: 'ไทม์ไลน์', html: timeline }, { id: 'r', label: 'Raw log', html: rawTab }, { id: 'n', label: `บันทึก (${comments.length})`, html: notes }],
      footer: html`${a.status === 'closed' ? act('เปิดใหม่', 'refresh', 'reopened') : html`${a.status === 'new' ? act('รับเรื่อง', 'check', 'in_progress') : ''}${act('มอบหมายให้ฉัน', 'user', 'assign')}${act('ปิดเคส', 'x', 'closed', 'pri')}`}`,
      onMount(el) {
        T.on(el, 'click', '[data-do]', (e, b) => {
          const s = b.dataset.do; if (s === 'assign') M.updateAlert([a.id], { assignee: 'demo.admin' }, 'assign → demo.admin'); else M.updateAlert([a.id], { status: s, ...(s === 'in_progress' && !a.assignee ? { assignee: 'demo.admin' } : {}) }, `status → ${s}`);
          T.toast('อัปเดตแล้ว', 'ok'); d.close(); T.refreshChrome(); after && after(); openAlert(id, after);
        });
        T.on(el, 'click', '[data-cp]', () => T.copy(JSON.stringify(a.raw, null, 2)));

        const f = T.$('#cform', el); if (f) f.onsubmit = (e) => { e.preventDefault(); const { ok, values } = T.readForm(f, { text: [T.V.required] }); if (!ok) return; M.addComment(a.id, values.text); T.toast('บันทึกความคิดเห็นแล้ว', 'ok'); d.close(); openAlert(id, after).tab('n'); };
      } });
    return d;
  }
  T.openAlert = openAlert;

  T.route('/alerts', {
    title: 'Alerts', group: 'Security',
    render(el, ctx) {
      const can = T.can('respond');
      T.mount(el, html`<div class="pghead"><div><h2>Alerts</h2><p>รวม alert จาก Endpoint, SaaS, Network และ Identity เรียงตามความรุนแรงและเวลา</p></div></div><div class="card" id="tbl"></div>`);
      const dt = new T.DataTable(T.$('#tbl', el), {
        id: 'alerts', pageSize: 12, sort: { key: 'time', dir: 'desc' }, searchKeys: ['title', 'host', 'user', 'id', 'technique', 'filename', 'ip'], searchPlaceholder: 'ค้นหา host, ผู้ใช้, technique, รหัส…', exportName: 'alerts',
        getRows: () => M.alerts(),
        filters: [{ key: 'sev', label: 'ความรุนแรง', options: T.SEV }, { key: 'status', label: 'สถานะ', options: Object.keys(ST).map((k) => ({ v: k, l: ST[k][1] })) }, { key: 'source', label: 'แหล่งที่มา', options: ['Endpoint (EDR)', 'SaaS Security', 'Network (NDR)', 'Identity'] },
          { key: 'age', label: 'ช่วงเวลา', options: [{ v: '1', l: '24 ชั่วโมง' }, { v: '7', l: '7 วัน' }, { v: '30', l: '30 วัน' }], match: (x, v) => x.time >= M.NOW - +v * 86400e3 }],
        columns: [
          { key: 'severity', label: 'ความรุนแรง', render: (r) => T.sevChip(r.sev), csv: (r) => r.sev },
          { key: 'title', label: 'เหตุการณ์', render: (r) => html`<div class="trunc" style="max-width:340px"><b>${r.title}</b></div><div class="muted trunc" style="font-size:12px;max-width:340px">${r.tactic} · ${r.techId}</div>`, csv: (r) => r.title },
          { key: 'host', label: 'เครื่อง', render: (r) => html`<span class="mono">${r.host}</span>` },
          { key: 'source', label: 'แหล่งที่มา' }, { key: 'tenantId', label: 'Tenant', render: (r) => M.tenantName(r.tenantId), sortVal: (r) => M.tenantName(r.tenantId), csv: (r) => M.tenantName(r.tenantId) },
          { key: 'status', label: 'สถานะ', render: (r) => stChip(r.status), csv: (r) => ST[r.status][1] },
          { key: 'time', label: 'เวลา', render: (r) => html`<span class="nowrap" title="${T.fmtFull(r.time)}">${T.ago(r.time)}</span>`, csv: (r) => T.fmtFull(r.time) },
          { key: 'assignee', label: 'ผู้รับผิดชอบ', render: (r) => r.assignee || html`<span class="muted">—</span>` },
        ],
        bulk: [{ label: 'รับเรื่อง', can: 'respond', run: (rows) => { M.updateAlert(rows.map((r) => r.id), { status: 'in_progress', assignee: 'demo.admin' }, 'bulk acknowledge'); T.toast(`รับเรื่อง ${rows.length} รายการ`, 'ok'); T.refreshChrome(); } },
          { label: 'ปิดเคส', can: 'respond', run: async (rows) => { if (await T.confirm(`ปิดเคส ${rows.length} รายการ?`, 'ปิดเคส')) { M.updateAlert(rows.map((r) => r.id), { status: 'closed' }, 'bulk close'); T.toast(`ปิดเคส ${rows.length} รายการ`, 'ok'); T.refreshChrome(); } } }],
        empty: 'ไม่พบ alert ที่ตรงกับเงื่อนไข ลองล้างตัวกรองหรือเปลี่ยนคำค้น',
        onRow: (r) => openAlert(r.id, () => dt.refresh()),
      });
      if (ctx && ctx.query && ctx.query.get('q')) { dt.q = ctx.query.get('q'); dt.draw(); }

    },
  });
})();

        const f = T.$('#iform', el); T.$('#itext', el).value = el._text || '';
        f.onsubmit = (e) => { e.preventDefault(); el._text = T.$('#itext', el).value; name = T.$('#iname', el).value.trim() || name; size = +T.$('#bsize', el).value; if (!el._text.trim()) { T.toast('กรุณาวางรายการ IOC ก่อน', 'warn'); return; } res = M.parseIOC(el._text); draw(); };

      T.on(el, 'click', '#save', () => { M.iocHistory().unshift({ id: T.uid(), name, total: res.ok.length + res.dup + res.bad.length, valid: res.ok.length, batches: Math.ceil(res.ok.length / size), at: Date.now() }); M.save('iocHistory'); M.audit('ioc.import', name, `${res.ok.length} valid`); T.toast('บันทึกลงประวัติแล้ว', 'ok'); draw(); });
    },
  });
})();

// ---- js/pages/wall.js
/* SOC Wall: full-screen live feed for a SOC room. */
(function () {
  'use strict';
  const { html, raw, icon: ic } = T;
  T.route('/wall', {
    title: 'SOC Wall',
    render(el) {
      let floor = T.store.get('wallFloor', 'low'); let feed = M.alerts().filter((a) => a.status === 'new').slice(0, 10).map((a) => ({ ...a, fresh: false })); let timers = [];
      const rank = { critical: 4, high: 3, medium: 2, low: 1, informational: 0 };
      const vis = () => feed.filter((a) => rank[a.sev] >= rank[floor]).slice(0, 12);
      const draw = () => {
        const all = M.alerts(); const day = all.filter((a) => a.time > M.NOW - 86400e3 + 0).length + feed.filter((a) => a.fresh).length; const crit = all.filter((a) => a.status !== 'closed' && a.sev === 'critical').length + feed.filter((a) => a.fresh && a.sev === 'critical').length; const hi = all.filter((a) => a.status !== 'closed' && a.sev === 'high').length;
        const bySev = T.SEV.map((s) => ({ label: s, value: all.filter((a) => a.sev === s && a.time > M.NOW - 7 * 86400e3).length, color: T.SEVC[s] })); const hosts = Object.entries(all.filter((a) => a.time > M.NOW - 7 * 86400e3).reduce((m, a) => ((m[a.host] = (m[a.host] || 0) + 1), m), {})).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 6);
        T.mount(el, html`<div style="padding:16px 20px;min-height:100vh"><div class="row" style="margin-bottom:14px">${raw(T.WM)}<b style="font-size:18px;letter-spacing:.12em">SOC WALL</b><span class="chip ok"><span class="dot ok pulse"></span> LIVE</span><span class="grow"></span><span class="mono" id="clock" style="font-size:18px"></span>
          <select class="select" id="floor" style="width:auto;background:#0d1626;border-color:#1b2a44" aria-label="ระดับต่ำสุดที่แสดง">${T.SEV.map((s) => html`<option value="${s}" ${s === floor ? raw('selected') : ''}>แสดงตั้งแต่ ${s}</option>`)}</select><button class="btn" id="fs">${ic('expand', 'sm')} เต็มจอ</button><a class="btn" href="#/dashboard">${ic('x', 'sm')} ออก</a></div>
          <div class="grid g4 wallbig"><div class="card kpi"><div class="l">Critical ที่เปิดอยู่</div><div class="v" style="color:var(--crit)">${crit}</div></div><div class="card kpi"><div class="l">High ที่เปิดอยู่</div><div class="v" style="color:var(--high)">${hi}</div></div><div class="card kpi"><div class="l">Alert ใน 24 ชั่วโมง</div><div class="v">${day}</div></div><div class="card kpi"><div class="l">Tenant ที่เฝ้าระวัง</div><div class="v">${M.tenants().filter((t) => t.wall).length}</div></div></div>
          <div class="grid g-main" style="margin-top:14px"><div class="card"><div class="hd"><h3>เหตุการณ์ล่าสุด</h3></div><div class="bd flush"><table class="t"><tbody>${vis().map((a) => html`<tr class="${a.fresh ? 'newrow' : ''}"><td style="width:96px">${T.sevChip(a.sev)}</td><td><b>${a.title}</b><div class="muted" style="font-size:12px">${a.host} · ${M.tenantName(a.tenantId)}</div></td><td class="nowrap muted">${T.ago(a.time)}</td></tr>`)}</tbody></table>${vis().length ? '' : html`<div class="empty">ไม่มีเหตุการณ์ในระดับที่เลือก</div>`}</div></div>
            <div class="stack"><div class="card"><div class="hd"><h3>ความรุนแรง (7 วัน)</h3></div><div class="bd">${T.chart.donut({ items: bySev, sub: 'alerts' })}</div></div><div class="card"><div class="hd"><h3>เครื่องที่พบบ่อย</h3></div><div class="bd">${T.chart.hbars(hosts)}</div></div></div></div></div>`);
        const clk = () => { const c = T.$('#clock', el); if (c) c.textContent = T.fmtFull(Date.now()); }; clk();
        T.$('#floor', el).onchange = (e) => { floor = e.target.value; T.store.set('wallFloor', floor); draw(); };
        T.$('#fs', el).onclick = () => { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen && d.requestFullscreen()); };
      };
      draw();
      const next = () => { const a = M.liveAlert(); a.fresh = true; feed.forEach((f) => (f.fresh = false)); feed.unshift(a); feed = feed.slice(0, 30); draw(); timers.push(setTimeout(next, 3500 + Math.random() * 3500)); };
      timers.push(setTimeout(next, 2500)); timers.push(setInterval(() => { const c = T.$('#clock', el); if (c) c.textContent = T.fmtFull(Date.now()); }, 1000));
      return () => timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
    },
  });
})();

// ---- js/pages/defacement.js
/* Web Defacement: content-diff monitoring of public sites. */
(function () {
  'use strict';
  const { html, raw, icon: ic } = T;
  const S = { green: ['ok', 'ปกติ'], yellow: ['med', 'เปลี่ยนแปลงเล็กน้อย'], red: ['crit', 'เปลี่ยนแปลงรุนแรง'], gray: ['gray', 'ตรวจไม่ได้'] };
  const chip = (s) => html`<span class="chip ${S[s][0]}">${S[s][1]}</span>`;
  const shot = (site, bad) => html`<div class="shotbox"><div class="bn" style="width:40%"></div>${bad ? html`<div class="hk">HACKED — เนื้อหาถูกแก้ไขโดยไม่ได้รับอนุญาต</div>` : html`<div class="bn" style="width:80%;height:22px;background:var(--accent-soft)"></div>`}<div class="bn" style="width:90%"></div><div class="bn" style="width:70%"></div><div class="bn" style="width:85%"></div><div class="muted mono" style="font-size:11px;margin-top:6px">${site.url}</div></div>`;
  T.route('/defacement', {
    title: 'Web Defacement', group: 'Security',
    render(el) {
      const draw = () => {
        const sites = M.sites(); const cnt = (s) => sites.filter((x) => x.status === s).length;
        T.mount(el, html`<div class="pghead"><div><h2>Web Defacement Monitor</h2><p>เทียบเนื้อหาหน้าเว็บกับค่าอ้างอิง (baseline) เพื่อตรวจจับการแก้ไขโดยไม่ได้รับอนุญาต</p></div><span class="grow"></span><button class="btn pri" id="add" ${T.can('manage') ? '' : raw('disabled')}>${ic('plus', 'sm')} เพิ่มเว็บไซต์</button></div>
          <div class="grid g4">${['green', 'yellow', 'red', 'gray'].map((s) => html`<div class="card kpi"><div class="l">${chip(s)}</div><div class="v">${cnt(s)}</div><div class="s">เว็บไซต์</div></div>`)}</div>
          <div class="card" style="margin-top:14px" id="tbl"></div>`);
        const dt = new T.DataTable(T.$('#tbl', el), { id: 'sites', pageSize: 10, searchKeys: ['url'], getRows: () => M.sites(), exportName: 'web-defacement',
          filters: [{ key: 'status', label: 'สถานะ', options: Object.keys(S).map((k) => ({ v: k, l: S[k][1] })) }],
          columns: [{ key: 'url', label: 'เว็บไซต์', render: (r) => html`<b>${r.url.replace('https://', '')}</b>` }, { key: 'status', label: 'สถานะ', render: (r) => chip(r.status), csv: (r) => r.status }, { key: 'similarity', label: 'ความเหมือนกับ baseline', render: (r) => (r.status === 'gray' ? '—' : html`<div class="row nw" style="min-width:140px"><div class="bar ${r.similarity < 60 ? 'crit' : r.similarity < 92 ? 'warn' : 'ok'} grow"><i style="width:${r.similarity}%"></i></div><span class="mono">${r.similarity}%</span></div>`), csv: (r) => r.similarity }, { key: 'changes', label: 'จุดที่เปลี่ยน', align: 'right' }, { key: 'history', label: '24 รอบล่าสุด', sortable: false, render: (r) => html`<div class="strip">${r.history.map((h) => html`<i class="${h}"></i>`)}</div>`, csv: false }, { key: 'lastCheck', label: 'ตรวจล่าสุด', render: (r) => T.ago(r.lastCheck), csv: (r) => T.fmtFull(r.lastCheck) },
            { key: 'act', label: '', sortable: false, csv: false, render: (r) => html`<button class="btn sm" data-re="${r.id}" ${r.status === 'gray' && !T.can('manage') ? raw('disabled') : ''}>${ic('refresh', 'sm')} ตรวจซ้ำ</button>` }],
          onRow: (r) => openSite(r, dt) });
        T.on(T.$('#tbl', el), 'click', '[data-re]', async (e, b) => { const s = M.sites().find((x) => x.id === b.dataset.re); b.disabled = true; b.innerHTML = 'กำลังตรวจ…'; await T.net.call('POST /defacement/check', () => 0, 900); s.lastCheck = Date.now(); if (s.status === 'gray') { s.status = 'green'; s.similarity = 98.6; s.history = [...s.history.slice(1), 'green']; } else s.history = [...s.history.slice(1), s.status === 'red' ? 'red' : s.status === 'yellow' ? 'yellow' : 'green']; M.save('sites'); M.audit('defacement.check', s.url, s.status); T.toast(`ตรวจ ${s.url.replace('https://', '')} เสร็จแล้ว: ${S[s.status][1]}`, s.status === 'red' ? 'bad' : 'ok'); draw(); });
      };
      function openSite(s, dt) {
        const diff = M.diffFor(s);
        T.drawer({ title: s.url.replace('https://', ''), sub: chip(s.status), width: 640, tabs: [{ id: 'o', label: 'ภาพรวม', html: html`<dl class="kv"><dt>ความเหมือน</dt><dd>${s.similarity}%</dd><dt>จุดที่เปลี่ยน</dt><dd>${s.changes}</dd><dt>baseline เมื่อ</dt><dd>${T.fmtFull(s.baselineAt).slice(0, 10)}</dd><dt>ตรวจทุก</dt><dd>${s.interval} นาที</dd><dt>hash ปัจจุบัน</dt><dd class="mono">${s.hash}</dd></dl>` },
          { id: 'd', label: 'ภาพเปรียบเทียบ', html: html`<div class="grid g2"><div><b style="font-size:12.5px">Baseline</b>${shot(s, false)}</div><div><b style="font-size:12.5px">ปัจจุบัน</b>${shot(s, s.status === 'red')}</div></div>` },
          { id: 'c', label: `ความแตกต่าง (${s.changes})`, html: s.changes ? html`<div class="diff">${diff.map((l) => html`<div class="${l.t === '+' ? 'p' : 'm'}">${l.t} ${l.s}</div>`)}</div>` : html`<div class="empty">${ic('check')}ไม่พบความแตกต่างจาก baseline</div>` }],
          footer: html`<button class="btn" data-bl ${T.can('manage') ? '' : raw('disabled')}>ตั้งค่าปัจจุบันเป็น baseline</button><button class="btn danger" data-del ${T.can('manage') ? '' : raw('disabled')}>${ic('trash', 'sm')} ลบ</button>`,
          onMount(d, entry) { T.on(d, 'click', '[data-bl]', async () => { if (!(await T.confirm('ตั้งเนื้อหาปัจจุบันเป็น baseline ใหม่? (ใช้เมื่อการเปลี่ยนแปลงเป็นการแก้ไขที่ได้รับอนุญาต)', 'ตั้งเป็น baseline', false))) return; s.status = 'green'; s.similarity = 100; s.changes = 0; s.baselineAt = Date.now(); s.history = [...s.history.slice(1), 'green']; M.save('sites'); M.audit('defacement.baseline', s.url); T.toast('ตั้งค่า baseline แล้ว', 'ok'); entry.close(); draw(); });
            T.on(d, 'click', '[data-del]', async () => { if (!(await T.confirm(`ลบ ${s.url} ออกจากการเฝ้าระวัง?`, 'ลบ'))) return; const a = M.sites(); a.splice(a.indexOf(s), 1); M.save('sites'); M.audit('defacement.delete', s.url); entry.close(); draw(); T.toast('ลบแล้ว', 'ok'); }); } });
      }
      draw();
      T.on(el, 'click', '#add', async () => { const ok = await T.modal({ title: 'เพิ่มเว็บไซต์ที่เฝ้าระวัง', okText: 'เพิ่ม', body: html`<form>${T.field({ name: 'url', label: 'URL', placeholder: 'https://www.example.com', required: true })}${T.field({ name: 'interval', label: 'ตรวจทุก (นาที)', type: 'select', options: [5, 15, 30, 60], value: 15 })}</form>`, onOk: (m) => { const r = T.readForm(m, { url: [T.V.required, T.V.url] }); if (!r.ok) return false; if (M.sites().some((x) => x.url === r.values.url)) { T.$('[data-f=url] .err', m).textContent = 'มีเว็บไซต์นี้อยู่แล้ว'; return false; } M.sites().unshift({ id: T.uid(), url: r.values.url, status: 'green', similarity: 100, changes: 0, lastCheck: Date.now(), interval: +r.values.interval, baselineAt: Date.now(), hash: Array.from({ length: 16 }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join(''), history: Array(24).fill('green') }); M.save('sites'); M.audit('defacement.add', r.values.url); return true; } }); if (ok) { T.toast('เพิ่มเว็บไซต์แล้ว กำลังสร้าง baseline', 'ok'); draw(); } });
    },
  });
})();

// ---- js/pages/health.js
/* System Health: agent fleet, live metrics, restricted remote shell, signed upgrades. */
(function () {
  'use strict';
  const { html, raw, icon: ic } = T;
  const LATEST = '1.4.1';
  const ST = { online: ['ok', 'ออนไลน์'], degraded: ['med', 'ช้า/เสี่ยง'], offline: ['crit', 'ออฟไลน์'] };
  const meter = (v, warn = 75, crit = 90) => html`<div class="row nw" style="min-width:92px"><div class="bar ${v >= crit ? 'crit' : v >= warn ? 'warn' : ''} grow"><i style="width:${v}%"></i></div><span class="mono" style="width:30px;text-align:right">${v}%</span></div>`;

  function shell(ag) {
    const out = []; const run = (c) => { const x = c.trim(); const [cmd] = x.split(/\s+/);
      if (!x) return ''; const base = { whoami: 'bewzab', hostname: ag.name, uptime: ` up ${ag.uptimeD} days, load average: ${(ag.cpu / 60).toFixed(2)}, 0.${ag.cpu % 9}1, 0.${ag.cpu % 7}0`, date: new Date().toString(),
        'df -h': `Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1       200G  ${Math.round(2 * ag.disk)}G   ${200 - Math.round(2 * ag.disk)}G  ${ag.disk}% /`, 'free -m': `              total   used   free\nMem:          16000  ${Math.round(160 * ag.ram)}  ${16000 - Math.round(160 * ag.ram)}`,
        'systemctl status bewzab-agent': `● bewzab-agent.service - BewZab monitoring agent\n   Active: active (running) since ${T.fmtFull(Date.now() - ag.uptimeD * 86400e3).slice(0, 10)}\n   Version: ${ag.agent}`, ps: 'PID TTY          TIME CMD\n 1  ?        00:00:03 systemd\n 214 ?       00:01:41 bewzab-agent', help: 'คำสั่งที่อนุญาต: help, whoami, hostname, uptime, date, df -h, free -m, ps, systemctl status bewzab-agent, clear' };
      if (x === 'clear') return '__clear'; return base[x] !== undefined ? base[x] : `bash: ${cmd}: คำสั่งนี้ไม่อยู่ในรายการที่อนุญาต (พิมพ์ help)`; };
    return { run, out };
  }

  T.route('/health', {
    title: 'System Health', group: 'Monitoring',
    render(el) {
      const draw = () => {
        const A = M.agents(); const c = (s) => A.filter((a) => a.status === s).length; const on = A.filter((a) => a.status !== 'offline'); const old = A.filter((a) => a.agent !== LATEST).length;
        T.mount(el, html`<div class="pghead"><div><h2>System Health</h2><p>สถานะเครื่องและ agent ภายในองค์กร ใช้ตรวจสอบทรัพยากร อัปเกรด agent และเข้าถึงเครื่องผ่านเทอร์มินัลที่จำกัดสิทธิ์</p></div></div>
          <div class="grid g4"><div class="card kpi"><div class="l"><span class="dot ok"></span> ออนไลน์</div><div class="v">${c('online')}</div></div><div class="card kpi"><div class="l"><span class="dot warn"></span> ช้า/เสี่ยง</div><div class="v">${c('degraded')}</div></div><div class="card kpi"><div class="l"><span class="dot bad"></span> ออฟไลน์</div><div class="v" style="color:${c('offline') ? 'var(--crit)' : 'inherit'}">${c('offline')}</div></div><div class="card kpi"><div class="l">${ic('activity')} CPU เฉลี่ย</div><div class="v">${Math.round(on.reduce((a, x) => a + x.cpu, 0) / Math.max(1, on.length))}%</div><div class="s">${old} เครื่องมี agent เวอร์ชันเก่า</div></div></div>
          <div class="card" style="margin-top:14px" id="tbl"></div>`);
        const dt = new T.DataTable(T.$('#tbl', el), { id: 'agents', pageSize: 10, searchKeys: ['name', 'ip', 'osVer'], exportName: 'agents', getRows: () => M.agents(), sort: { key: 'name', dir: 'asc' },
          filters: [{ key: 'status', label: 'สถานะ', options: Object.keys(ST).map((k) => ({ v: k, l: ST[k][1] })) }, { key: 'os', label: 'ระบบปฏิบัติการ', options: ['Linux', 'Windows'] }],
          bulk: [{ label: 'อัปเกรด agent', can: 'respond', run: async (rows) => { const t = rows.filter((r) => r.agent !== LATEST && r.status !== 'offline'); if (!t.length) { T.toast('เครื่องที่เลือกเป็นเวอร์ชันล่าสุดหรือออฟไลน์', 'warn'); return; } await T.net.call('POST /agents/upgrade', () => 0, 900); t.forEach((r) => (r.agent = LATEST)); M.save('agents'); M.audit('agent.upgrade', `${t.length} agents`, LATEST); T.toast(`อัปเกรด ${t.length} เครื่องเป็น ${LATEST} แล้ว`, 'ok'); } }],
          columns: [{ key: 'name', label: 'เครื่อง', render: (r) => html`<span class="dot ${ST[r.status][0] === 'ok' ? 'ok' : ST[r.status][0] === 'med' ? 'warn' : 'bad'}"></span> <b>${r.name}</b><div class="muted" style="font-size:12px">${r.osVer}</div>` }, { key: 'ip', label: 'IP', render: (r) => html`<span class="mono">${r.ip}</span>` }, { key: 'status', label: 'สถานะ', render: (r) => html`<span class="chip ${ST[r.status][0]}">${ST[r.status][1]}</span>`, csv: (r) => r.status }, { key: 'cpu', label: 'CPU', render: (r) => meter(r.cpu) }, { key: 'ram', label: 'RAM', render: (r) => meter(r.ram) }, { key: 'disk', label: 'ดิสก์', render: (r) => meter(r.disk, 80, 92) },
            { key: 'agent', label: 'Agent', render: (r) => html`<span class="mono">${r.agent}</span> ${r.agent !== LATEST ? html`<span class="chip med">อัปเดตได้</span>` : ''}` }, { key: 'lastSeen', label: 'เห็นล่าสุด', render: (r) => T.ago(r.lastSeen), csv: (r) => T.fmtFull(r.lastSeen) }],
          onRow: (r) => detail(r, dt) });
      };
      function detail(ag, dt) {
        const labels = Array.from({ length: 48 }, (_, i) => `${String(Math.floor((i * 0.5 + new Date().getHours() - 24 + 48) % 24)).padStart(2, '0')}:00`);
        const can = T.can('respond'); const sh = shell(ag);

            { id: 'a', label: 'จัดการ', html: html`<dl class="kv"><dt>Agent</dt><dd class="mono">${ag.agent} ${ag.agent !== LATEST ? html`<span class="chip med">มีเวอร์ชัน ${LATEST}</span>` : html`<span class="chip ok">ล่าสุด</span>`}</dd><dt>Uptime</dt><dd>${ag.uptimeD} วัน</dd><dt>เห็นล่าสุด</dt><dd>${T.fmtFull(ag.lastSeen)}</dd></dl><div class="row" style="margin-top:14px"><button class="btn pri" data-up ${can && ag.agent !== LATEST && ag.status !== 'offline' ? '' : raw('disabled')}>${ic('upload', 'sm')} อัปเกรด agent (ลงลายเซ็น)</button><button class="btn" data-rs ${can && ag.status !== 'offline' ? '' : raw('disabled')}>${ic('refresh', 'sm')} รีสตาร์ท agent</button></div><div id="prog" style="margin-top:12px"></div>` }],

// ---- js/pages/users.js
/* Users: accounts, roles & permission matrix, invitations (role-capped). */
(function () {
  'use strict';
  const { html, raw, icon: ic } = T;

        if (tab === 'users') {
          T.mount(body, html`<div class="card" id="tbl"></div>`);
          const dt = new T.DataTable(T.$('#tbl', body), { id: 'us', pageSize: 10, searchKeys: ['name', 'email'], exportName: 'users', getRows: () => M.users(),
            toolbar: html`<button class="btn pri sm" id="inv" ${canU() ? '' : raw('disabled title="ไม่มีสิทธิ์"')}>${ic('plus', 'sm')} เชิญผู้ใช้</button>`, filters: [{ key: 'role', label: 'บทบาท', options: ROLES }, { key: 'active', label: 'สถานะ', options: [{ v: 'true', l: 'ใช้งาน' }, { v: 'false', l: 'ปิดใช้งาน' }], match: (x, v) => String(x.active) === v }],
            columns: [{ key: 'name', label: 'ผู้ใช้', render: (r) => html`<b>${r.name}</b><div class="muted mono" style="font-size:11.5px">${r.email}</div>` }, { key: 'role', label: 'บทบาท', render: (r) => html`<span class="chip ${RC[r.role]}">${r.role}</span>` }, { key: 'mfa', label: 'MFA', render: (r) => (r.mfa ? html`<span class="chip ok">เปิด</span>` : html`<span class="chip med">ยังไม่ตั้งค่า</span>`), csv: (r) => r.mfa }, { key: 'active', label: 'สถานะ', render: (r) => (r.active ? html`<span class="chip ok">ใช้งาน</span>` : html`<span class="chip gray">ปิดใช้งาน</span>`), csv: (r) => r.active }, { key: 'tenants', label: 'Tenant' }, { key: 'lastLogin', label: 'เข้าใช้ล่าสุด', render: (r) => T.ago(r.lastLogin), csv: (r) => T.fmtFull(r.lastLogin) }],
            onRow: (r) => userDrawer(r, dt) });
          T.on(body, 'click', '#inv', async () => { const ok = await T.modal({ title: 'เชิญผู้ใช้', okText: 'ส่งคำเชิญ', body: html`<form>${T.field({ name: 'email', label: 'อีเมล', type: 'email', required: true })}${T.field({ name: 'role', label: 'บทบาท', type: 'select', options: inviteRoles(), value: 'Staff' })}<div class="muted" style="font-size:12px">คุณเชิญได้ถึงบทบาทเท่ากับของคุณ (${T.state.role}) เท่านั้น</div></form>`, onOk: (m) => { const r = T.readForm(m, { email: [T.V.required, T.V.email] }); if (!r.ok) return false; if (M.users().some((u) => u.email === r.values.email.toLowerCase()) || M.invites().some((i) => i.email === r.values.email.toLowerCase() && i.status === 'pending')) { T.$('[data-f=email] .err', m).textContent = 'มีบัญชีหรือคำเชิญนี้อยู่แล้ว'; return false; } M.invites().unshift({ id: T.uid(), email: r.values.email.toLowerCase(), role: r.values.role, sent: Date.now(), status: 'pending' }); M.save('invites'); M.audit('user.invite', r.values.email, r.values.role); return true; } }); if (ok) T.toast('ส่งคำเชิญแล้ว', 'ok'); });
        } else if (tab === 'roles') {
          const caps = M.roleCaps(); const can = T.can('admin');
          T.mount(body, html`<div class="card"><div class="hd"><h3>เมทริกซ์สิทธิ์</h3><span class="grow"></span><span class="muted" style="font-size:12px">${can ? 'ติ๊กเพื่อเปลี่ยนสิทธิ์ของบทบาท' : 'เฉพาะ Super Admin เท่านั้นที่แก้ไขได้'}</span></div><div class="bd flush"><div class="twrap"><table class="t"><thead><tr><th>ความสามารถ</th>${ROLES.map((r) => html`<th class="center">${r}</th>`)}</tr></thead><tbody>${M.CAPS.map(([k, l]) => html`<tr><td>${l}<div class="muted mono" style="font-size:11px">${k}</div></td>${ROLES.map((r) => html`<td class="center"><input type="checkbox" data-cap="${r}:${k}" ${caps[r][k] ? raw('checked') : ''} ${can && r !== 'Super Admin' ? '' : raw('disabled')} aria-label="${r} ${l}"></td>`)}</tr>`)}</tbody></table></div></div></div>`);
          T.on(body, 'change', '[data-cap]', (e, c) => { const [r, k] = c.dataset.cap.split(':'); caps[r][k] = c.checked; M.save('roleCaps'); M.audit('role.capability', r, `${k} → ${c.checked}`); T.toast('บันทึกสิทธิ์แล้ว', 'ok'); });
        } else {
          T.mount(body, html`<div class="card"><div class="bd flush"><table class="t cards"><thead><tr><th>อีเมล</th><th>บทบาท</th><th>ส่งเมื่อ</th><th>สถานะ</th><th></th></tr></thead><tbody>${M.invites().map((i) => html`<tr><td data-label="อีเมล" class="mono">${i.email}</td><td data-label="บทบาท"><span class="chip ${RC[i.role]}">${i.role}</span></td><td data-label="ส่งเมื่อ">${T.ago(i.sent)}</td><td data-label="สถานะ">${i.status === 'pending' ? html`<span class="chip med">รอตอบรับ</span>` : html`<span class="chip ok">ตอบรับแล้ว</span>`}</td><td class="nolabel">${i.status === 'pending' ? html`<button class="btn sm" data-cp="${i.id}">${ic('copy', 'sm')} คัดลอกลิงก์</button> <button class="btn sm danger" data-rv="${i.id}" ${canU() ? '' : raw('disabled')}>ยกเลิก</button>` : ''}</td></tr>`)}</tbody></table></div></div>`);
          T.on(body, 'click', '[data-cp]', (e, b) => T.copy(`https://console.tenix.example/invite/${b.dataset.cp}`));
          T.on(body, 'click', '[data-rv]', async (e, b) => { if (await T.confirm('ยกเลิกคำเชิญนี้?', 'ยกเลิกคำเชิญ')) { const a = M.invites(); a.splice(a.findIndex((x) => x.id === b.dataset.rv), 1); M.save('invites'); M.audit('user.invite_revoke', b.dataset.rv); draw(); } });
        }
      };
      function userDrawer(u, dt) {
        const can = canU(); const dis = can ? '' : raw('disabled'); const adminOnly = T.can('admin') ? '' : raw('disabled title="เฉพาะ Super Admin"');
        const d = T.drawer({ title: u.name, sub: html`<span class="mono">${u.email}</span>`, width: 540, body: html`<dl class="kv"><dt>บทบาท</dt><dd><select class="select" id="role" ${adminOnly} style="width:auto">${ROLES.map((r) => html`<option ${r === u.role ? raw('selected') : ''}>${r}</option>`)}</select></dd><dt>สถานะ</dt><dd class="row nw">${T.switchEl(u.active, 'data-act')}<span>${u.active ? 'ใช้งาน' : 'ปิดใช้งาน'}</span></dd><dt>MFA</dt><dd>${u.mfa ? 'เปิดใช้งาน' : 'ยังไม่ตั้งค่า'}</dd><dt>Tenant</dt><dd>${u.tenants}</dd><dt>เข้าใช้ล่าสุด</dt><dd>${T.fmtFull(u.lastLogin)}</dd></dl>`,
          footer: html`<button class="btn" data-mfa ${dis}>รีเซ็ต MFA</button><button class="btn" data-sess ${dis}>เพิกถอน session ทั้งหมด</button><button class="btn danger" data-del ${adminOnly}>${ic('trash', 'sm')} ลบผู้ใช้</button>`,
          onMount(e2, en) {
            const guard = (nextRole, nextActive) => u.role === 'Super Admin' && (nextRole !== 'Super Admin' || nextActive === false) && supers().length <= 1;
            T.on(e2, 'change', '#role', (e, s) => { if (guard(s.value, u.active)) { T.toast('ต้องมี Super Admin ที่ใช้งานอยู่อย่างน้อย 1 คน', 'warn'); s.value = u.role; return; } const old = u.role; u.role = s.value; M.save('users'); M.audit('user.role', u.email, `${old} → ${u.role}`); T.toast('เปลี่ยนบทบาทแล้ว', 'ok'); dt.refresh(); });
            T.on(e2, 'click', '[data-act]', (e, b) => { if (u.active && guard(u.role, false)) { T.toast('ไม่สามารถปิด Super Admin คนสุดท้ายได้', 'warn'); return; } u.active = !u.active; M.save('users'); M.audit('user.active', u.email, String(u.active)); T.toast(u.active ? 'เปิดใช้งานแล้ว' : 'ปิดใช้งานแล้ว', 'ok'); en.close(); dt.refresh(); });
            T.on(e2, 'click', '[data-mfa]', async () => { if (await T.confirm(`รีเซ็ต MFA ของ ${u.email}? ผู้ใช้ต้องตั้งค่าใหม่ในการเข้าใช้ครั้งถัดไป`, 'รีเซ็ต')) { u.mfa = false; M.save('users'); M.audit('user.mfa_reset', u.email); T.toast('รีเซ็ต MFA แล้ว', 'ok'); en.close(); dt.refresh(); } });
            T.on(e2, 'click', '[data-sess]', async () => { await T.net.call('POST /sessions/revoke', () => 0, 500); M.audit('user.sessions_revoke', u.email); T.toast('เพิกถอน session แล้ว', 'ok'); });
            T.on(e2, 'click', '[data-del]', async () => { if (guard('x', false)) { T.toast('ไม่สามารถลบ Super Admin คนสุดท้ายได้', 'warn'); return; } if (await T.confirm(`ลบผู้ใช้ ${u.email}?`, 'ลบ')) { const a = M.users(); a.splice(a.indexOf(u), 1); M.save('users'); M.audit('user.delete', u.email); T.toast('ลบผู้ใช้แล้ว', 'ok'); en.close(); dt.refresh(); } });
          } });
      }
      draw(); T.on(el, 'click', '[data-tab]', (e, b) => { tab = b.dataset.tab; T.store.set('usersTab', tab); draw(); });
    },
  });
})();

// ---- js/pages/proxy.js
/* Proxy Hub: per-tenant read-only API tokens, usage, and a try-it console. */
(function () {
  'use strict';
  const { html, raw, icon: ic } = T;
  const rtok = () => 'tnx_' + Array.from({ length: 32 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join('');
  T.route('/proxy', {
    title: 'Proxy Hub', group: 'Management',
    render(el) {
      let lastResult = null;
      const draw = () => {
        const K = M.tokens(); const act = K.filter((k) => k.status === 'active'); const r = T.rng(5); const labels = Array.from({ length: 14 }, (_, i) => { const d = new Date(M.NOW - (13 - i) * 86400e3); return `${d.getDate()}/${d.getMonth() + 1}`; });
        T.mount(el, html`<div class="pghead"><div><h2>Proxy Hub</h2><p>ให้ระบบของลูกค้าดึงข้อมูลของตนเองแบบอ่านอย่างเดียว ผ่าน token ที่ผูกกับ Tenant เดียว</p></div><span class="grow"></span><button class="btn pri" id="nt" ${T.can('manage') ? '' : raw('disabled')}>${ic('plus', 'sm')} สร้าง token</button></div>
          <div class="grid g3"><div class="card kpi"><div class="l">${ic('key')} Token ที่ใช้งาน</div><div class="v">${act.length}</div></div><div class="card kpi"><div class="l">${ic('activity')} คำขอ 30 วัน</div><div class="v">${T.num(K.reduce((a, k) => a + k.requests, 0))}</div></div><div class="card kpi"><div class="l">${ic('lock')} สิทธิ์</div><div class="v" style="font-size:18px">อ่านอย่างเดียว</div><div class="s">ไม่มีคำสั่งแก้ไขหรือลบ</div></div></div>
          <div class="grid g-main" style="margin-top:14px"><div class="card"><div class="hd"><h3>จำนวนคำขอรายวัน</h3></div><div class="bd">${T.chart.bars({ labels, series: [{ name: 'คำขอ', color: 'var(--accent)', data: labels.map(() => Math.round(900 + r() * 1400)) }], height: 180 })}</div></div><div class="card"><div class="hd"><h3>Endpoints</h3></div><div class="bd">${M.ENDPOINTS.map(([m, p, d]) => html`<div style="padding:7px 0;border-bottom:1px solid var(--border)"><span class="chip ok">${m}</span> <span class="mono" style="font-size:12px">${p}</span><div class="muted" style="font-size:12px">${d}</div></div>`)}</div></div></div>
          <div class="card" style="margin-top:14px" id="tbl"></div>
          <div class="card" style="margin-top:14px"><div class="hd"><h3>ทดลองเรียก API</h3></div><div class="bd"><form id="try" class="row" style="align-items:flex-end"><div class="field" style="margin:0;min-width:200px"><label>Token</label><select class="select" name="tok">${act.map((k) => html`<option value="${k.id}">${k.name} (${k.prefix}…)</option>`)}</select></div><div class="field" style="margin:0;min-width:240px"><label>Endpoint</label><select class="select" name="ep">${M.ENDPOINTS.map(([m, p]) => html`<option>${p}</option>`)}</select></div><button class="btn pri" ${act.length ? '' : raw('disabled')}>${ic('play', 'sm')} เรียก</button></form><div id="res" style="margin-top:12px">${lastResult ? html`<div class="muted" style="font-size:12px;margin-bottom:4px">${lastResult.status} · ${lastResult.ms} ms · ข้อมูลเฉพาะ ${lastResult.tenant}</div><div class="code">${T.jsonHL(lastResult.body)}</div>` : html`<div class="muted">เลือก token และ endpoint แล้วกด "เรียก"</div>`}</div></div></div>`);
        const dt = new T.DataTable(T.$('#tbl', el), { id: 'tok', pageSize: 8, searchKeys: ['name', 'prefix'], getRows: () => M.tokens(), exportName: 'proxy-tokens',
          columns: [{ key: 'name', label: 'ชื่อ', render: (r2) => html`<b>${r2.name}</b>` }, { key: 'tenantId', label: 'Tenant', render: (r2) => M.tenantName(r2.tenantId), sortVal: (r2) => M.tenantName(r2.tenantId), csv: (r2) => M.tenantName(r2.tenantId) }, { key: 'prefix', label: 'Token', render: (r2) => html`<span class="mono">${r2.prefix}••••••••</span>` }, { key: 'scope', label: 'สิทธิ์' }, { key: 'requests', label: 'คำขอ 30 วัน', align: 'right', render: (r2) => T.num(r2.requests) }, { key: 'lastUsed', label: 'ใช้ล่าสุด', render: (r2) => T.ago(r2.lastUsed), csv: (r2) => T.fmtFull(r2.lastUsed) }, { key: 'status', label: 'สถานะ', render: (r2) => (r2.status === 'active' ? html`<span class="chip ok">ใช้งาน</span>` : html`<span class="chip gray">เพิกถอน</span>`), csv: (r2) => r2.status },
            { key: 'act', label: '', sortable: false, csv: false, render: (r2) => (r2.status === 'active' ? html`<button class="btn sm danger" data-rv="${r2.id}" ${T.can('manage') ? '' : raw('disabled')}>เพิกถอน</button>` : '') }] });
        T.on(T.$('#tbl', el), 'click', '[data-rv]', async (e, b) => { const k = M.tokens().find((x) => x.id === b.dataset.rv); if (await T.confirm(`เพิกถอน token "${k.name}"? ระบบที่ใช้ token นี้จะเรียกไม่ได้ทันที`, 'เพิกถอน')) { k.status = 'revoked'; M.save('tokens'); M.audit('proxy.revoke', k.name); T.toast('เพิกถอนแล้ว', 'ok'); draw(); } });
        T.$('#try', el).onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target); const k = M.tokens().find((x) => x.id === f.get('tok')); const ep = f.get('ep'); const t0 = performance.now(); await T.net.call('GET ' + ep, () => 0, 250);
          const al = M.alertsBase().filter((a) => a.tenantId === k.tenantId); let body;
          if (ep.endsWith('/alerts')) body = { tenant: M.tenantName(k.tenantId), total: al.length, resources: al.slice(0, 3).map((a) => ({ id: a.id, severity: a.sev, status: a.status, host: a.host, technique: a.techId, created: new Date(a.time).toISOString() })) };
          else if (ep.includes('{id}')) body = { id: al[0].id, severity: al[0].sev, status: al[0].status, host: al[0].host, tactic: al[0].tactic, technique: al[0].technique };
          else if (ep.endsWith('/hosts')) body = { total: M.tenants().find((t) => t.id === k.tenantId).hosts, resources: [...new Set(al.map((a) => a.host))].slice(0, 5).map((h) => ({ hostname: h, platform: 'Windows', status: 'normal' })) };
          else body = { critical: al.filter((a) => a.sev === 'critical').length, high: al.filter((a) => a.sev === 'high').length, medium: al.filter((a) => a.sev === 'medium').length, low: al.filter((a) => a.sev === 'low').length };
          k.requests++; k.lastUsed = Date.now(); M.save('tokens'); M.audit('proxy.try', k.name, ep); lastResult = { status: '200 OK', ms: Math.round(performance.now() - t0), tenant: M.tenantName(k.tenantId), body }; draw(); };
      };
      draw();
